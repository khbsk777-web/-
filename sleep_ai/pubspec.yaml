name: sleep_ai
description: AI-powered sleep and snore tracking application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.1.1
  firebase_messaging: ^15.0.4

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Health
  health: ^10.2.0

  # Audio
  record: ^5.1.2
  just_audio: ^0.9.39
  permission_handler: ^11.3.1
  noise_meter: ^6.0.1

  # Background
  flutter_background_service: ^5.0.5
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.2
  wakelock_plus: ^1.2.8

  # HTTP & API
  dio: ^5.5.0+1
  retrofit: ^4.1.0

  # UI
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  gap: ^3.0.1
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1

  # In-App Purchase
  purchases_flutter: ^7.3.4

  # CSV
  csv: ^6.0.0
  share_plus: ^10.0.3

  # Utils
  uuid: ^4.4.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700

name: 未登録店データの更新（全国のイオン・ドラッグストア）
# gacha-map/data/refresh.txt を書き換えて push すると実行される
on:
  push:
    branches: [gh-pages]
    paths: ['gacha-map/data/refresh.txt']
permissions:
  contents: write
concurrency:
  group: facilities
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 外部のアクションは使わず、git だけで取得（安全のため）
      - name: Get files
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPO}.git" site
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download Japan map data (Geofabrik / OpenStreetMap)
        run: curl -fsSL --retry 3 -o japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf && ls -lh japan.osm.pbf
      - name: Pick out stores
        run: |
          osmium tags-filter japan.osm.pbf nwr/shop=chemist,mall,department_store,supermarket -o sel.osm.pbf
          osmium export sel.osm.pbf -f geojsonseq -a type,id --format-option=print_record_separator=false -o sel.geojsonseq
          wc -l sel.geojsonseq
      - name: Build list
        run: python3 site/gacha-map/data/build_facilities.py sel.geojsonseq
      - name: Save
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-map/data/facilities.json
          git diff --cached --quiet && exit 0
          git commit -m "未登録店データを更新（OpenStreetMap）"
          git push origin gh-pages

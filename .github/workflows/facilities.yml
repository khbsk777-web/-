name: 未登録店データの更新（全国のイオン・ドラッグストア）
# gacha-map/data/refresh.txt を書き換えて push すると実行される
on:
  push:
    branches: [gh-pages]
    paths: ['gacha-map/data/refresh.txt']
permissions:
  contents: write
concurrency:
  group: facilities
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 外部のアクションは使わず、git だけで取得（安全のため）
      - name: Get files
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPO}.git" site
      - name: Build list from OpenStreetMap
        working-directory: site
        run: python3 gacha-map/data/build_facilities.py
      - name: Save
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-map/data/facilities.json
          git diff --cached --quiet && exit 0
          git commit -m "未登録店データを更新（OpenStreetMap）"
          git push origin gh-pages

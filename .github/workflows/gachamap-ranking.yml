name: ガチャマップ 全国ランキング更新（1時間ごと）
# ガチャマップ（gh-pages ブランチの gacha-map/）のランキングを計算して gacha-map/data/ranking.json に保存する。
# ほかのアプリ（flea_market_app / sleep_ai）には関係しません。
# Firebase の管理用の鍵は GitHub の Secrets「FIREBASE_SERVICE_ACCOUNT」にだけ保存（コードには書かない）。
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gachamap-ranking
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check key
        id: chk
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Firebase の鍵がまだ登録されていないのでスキップします"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      # 外部のアクションは使わず、git だけで取得（安全のため）
      - name: Get files
        if: steps.chk.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPO}.git" site
      - name: Install
        if: steps.chk.outputs.skip != '1'
        working-directory: site/gacha-map/data/ranking
        run: npm install firebase-admin@14.5.0 --no-save --no-audit --no-fund --ignore-scripts
      - name: Compute ranking
        if: steps.chk.outputs.skip != '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node site/gacha-map/data/ranking/build_ranking.js site/gacha-map/data/ranking.json
      - name: Save
        if: steps.chk.outputs.skip != '1'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-map/data/ranking.json
          git diff --cached --quiet && exit 0
          git commit -m "ランキングを更新"
          git push origin gh-pages
